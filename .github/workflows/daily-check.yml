# ------------------------------------------------------------------
# GitHub Actions workflow: Daily Website Check
#
# GitHub reads every .yml file inside .github/workflows/ automatically.
# This one starts a fresh Linux machine every day, installs Python,
# runs check_website.py, and the script sends the report to Telegram.
# ------------------------------------------------------------------

# The name shown in the "Actions" tab of your repository.
name: Daily Website Check

# "on" = WHEN the workflow runs (the trigger / event).
on:
  # 1) On a timer. Cron times are ALWAYS in UTC.
  #    Format: minute hour day-of-month month day-of-week
  #    "0 3 * * *" = 03:00 UTC every day = 09:00 AM Bangladesh time (UTC+6)
  schedule:
    - cron: "0 3 * * *"

  # 2) By hand: adds a "Run workflow" button in the Actions tab.
  workflow_dispatch:

# The job only needs to read the code, so give it no other access.
permissions:
  contents: read

# "jobs" = the work to do. A workflow can have many jobs; we need one.
jobs:
  check:                        # the job's id (any name you like)
    runs-on: ubuntu-latest      # the "runner": a fresh Linux VM from GitHub
    timeout-minutes: 5          # stop it if something hangs

    # "steps" run one after another, on the same machine.
    steps:
      # "uses" = run a ready-made action from GitHub Marketplace.
      # This one downloads your repository's files onto the runner.
      - name: Download the code
        uses: actions/checkout@v7

      # Install Python. "with" passes options to the action.
      # cache: pip keeps downloaded packages between runs, so it's faster.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # "run" = run a shell command, like typing in a terminal.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check websites and send Telegram report
        run: python check_website.py
        # "env" sets environment variables for this step.
        # ${{ secrets.NAME }} reads a secret you saved in:
        # repo Settings > Secrets and variables > Actions.
        # Secrets are hidden (***) in the logs.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
